<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Uploader</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Quote Uploader</h1>
        <div class="quote-of-the-day" id="quote-of-the-day"></div>
        <div class="upload-form">
            <textarea id="quote-input" placeholder="Enter your quote here..."></textarea>
            <input type="text" id="tags-input" placeholder="Enter tags separated by commas">
            <button onclick="uploadQuote()">Upload Quote</button>
        </div>
        <div class="search-form">
            <input type="text" id="search-input" placeholder="Search quotes..." oninput="searchQuotes()">
        </div>
        <div class="filter-sort">
            <button onclick="showTopQuotes()">Top Quotes</button>
            <select id="tag-select" onchange="filterByTag()">
                <option value="">Filter by Tag</option>
            </select>
        </div>
        <div class="quotes-list" id="quotes-list">
            <!-- Quotes will be displayed here -->
        </div>
    </div>

    <!-- User Profile Modal -->
    <div id="profile-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('profile-modal')">&times;</span>
            <h2>User Profile</h2>
            <div id="profile-quotes">
                <!-- User's quotes will be displayed here -->
            </div>
        </div>
    </div>

    <!-- Comments Modal -->
    <div id="comments-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('comments-modal')">&times;</span>
            <h2>Comments</h2>
            <div id="comments-list"></div>
            <textarea id="comment-input" placeholder="Enter your comment here..."></textarea>
            <button onclick="addComment()">Add Comment</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
